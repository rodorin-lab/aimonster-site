name: Purchase delivery checks
on:
  pull_request:
  push:
    branches: [main, fix/purchase-delivery]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx prisma migrate deploy
      - run: npx tsc --noEmit
