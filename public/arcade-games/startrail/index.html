<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STARTRAIL — ロドリンとエイリスの星の冒険</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090f21;color:#eef5ff;font-family:system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;background-image:radial-gradient(ellipse at 50% 20%,#1b2d50,transparent 65%)}main{width:min(1100px,96vw);padding:24px 0}.eyebrow{color:#68e7cf;letter-spacing:.3em;font-size:12px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:18px}h1{font-size:clamp(28px,5vw,48px);letter-spacing:.12em;margin:6px 0}p{color:#a8b8d4;margin:6px 0;font-size:14px}button{border:1px solid #52658b;border-radius:10px;padding:10px 17px;background:#1b2d4b;color:white;cursor:pointer;font:inherit}button:hover{background:#304666}canvas{width:100%;display:block;aspect-ratio:16/9;border-radius:18px;border:1px solid #405373;box-shadow:0 25px 80px #0007;background:#101d38;touch-action:none;outline:none}canvas:focus{border-color:#71efd7}.bottom{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:16px 2px;color:#a8b8d4;font-size:13px}kbd{background:#1b2b45;border:1px solid #405373;border-radius:5px;padding:2px 7px;color:#fff}.touch{display:flex;gap:10px;justify-content:center;margin-top:10px}.touch button{min-width:68px;touch-action:none;user-select:none}#status{color:#86ecd6}footer{text-align:center;font-size:11px;color:#637a9c;margin-top:18px}
</style>
<main>
<header><div><div class="eyebrow">A LITTLE ADVENTURE FOR RODORIN</div><h1>STARTRAIL<span style="color:#77eed8"> ✦</span></h1><p>ロドリンとエイリスの、小さな星の冒険。</p></div><button id="restart">↻ はじめから</button></header>
<canvas id="game" width="960" height="540" tabindex="0" aria-label="星を集める横スクロールアクションゲーム。矢印キーで移動、スペースでジャンプ。"></canvas>
<div class="bottom"><span><kbd>←</kbd> <kbd>→</kbd> / A・D 移動　<kbd>Space</kbd> ジャンプ（2回）　<kbd>P</kbd> 一時停止　<kbd>R</kbd> リトライ</span><span id="status" aria-live="polite">準備OK！</span></div>
<div class="touch"><button data-key="ArrowLeft" aria-label="左へ">◀</button><button data-key="ArrowRight" aria-label="右へ">▶</button><button data-key="Space">ジャンプ ✦</button></div>
<footer>MADE WITH AILIS & RODORIN · 敵は上から踏めるよ。落ちても、何度でも挑戦！</footer>
</main>
<script src="game.js"></script>
</html>
