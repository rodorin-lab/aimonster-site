<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IRIS — 戦術パイロット支援</title><link rel="stylesheet" href="campaign.css"><style>body{overflow:auto;padding:30px 22px;background:radial-gradient(at top right,#173c49,#07101c)}h1{font-size:54px;letter-spacing:-2px}#state{color:#9bb9c8;font-size:12px;line-height:2}.portrait{width:100%;max-height:220px;object-fit:cover;object-position:center 35%;border:1px solid var(--line)}#message{font-size:18px;line-height:1.9}.danger{color:#ffb298}.meter{margin:16px 0}.note{margin-top:22px}</style></head><body><span class="eyebrow">LOCAL TACTICAL COMPANION</span><h1>IRIS<span>ONLINE</span></h1><img class="portrait" src="assets/operator.png" alt="管制官セラ"><h3 id="mission">接続を待っています…</h3><div id="state">ゲーム画面からこのパネルを開いてください。</div><div class="meter"><i id="hp"></i></div><p id="message" role="status">戦術リンク待機中</p><label class="setting">主武装の自動射撃支援<input type="checkbox" id="auto"></label><button id="pause-link">一時停止 / 再開</button><p class="note">外部AIサーバーに接続しない、ローカルなルールベース支援です。<br>別ウィンドウへ移るとゲームは自動停止します。<br>セーブ・装備変更はゲーム本体で行ってください。</p><script src="companion.js"></script></body></html>
