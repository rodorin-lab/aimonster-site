<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080e16"><title>IRON VANGUARD — 灰都の機兵</title><link rel="stylesheet" href="style.css"></head>
<body>
<main id="shell">
 <canvas id="battle" aria-label="ロボット戦闘フィールド"></canvas>
 <div class="vignette"></div>
 <header><a class="brand" href="#" aria-label="タイトルへ戻る">IV<span>IRON VANGUARD<small>TACTICAL COMBAT SYSTEM / 09</small></span></a><div class="status"><i></i> SYSTEM ONLINE <button id="sound" aria-pressed="false">音 OFF</button><button id="pause" aria-label="一時停止">Ⅱ</button></div></header>
 <section id="hud" class="hidden" aria-label="機体状態"><div class="unit"><span class="eyebrow">VANGUARD / UNIT 01</span><strong id="armor">240 <small>AP</small></strong><div class="meter"><i id="hpbar"></i></div><div class="energy"><span>BOOST</span><div class="meter"><i id="enbar"></i></div></div></div><div class="mission"><span class="eyebrow" id="phase">OPERATION ASHFALL</span><h2 id="objective">敵機を排除せよ</h2><span id="enemycount"></span></div><div class="weapons"><span id="weapon">01 / ASSAULT RIFLE</span><div><b>Q</b><span id="missile">MISSILE READY</span></div><div><b>E</b><span id="blade">BLADE READY</span></div></div></section>
 <div id="bossbar" class="hidden"><span>HEAVY ARSENAL // GOLIATH</span><div class="meter"><i></i></div></div>
 <div id="notice" role="status"></div>
 <div id="overlay"><section class="panel" id="menu"></section></div>
 <footer><span>AILIS × RODORIN <em>ORIGINAL MECHA PROJECT</em></span><span id="hint">WASD 移動 / マウス 照準 / クリック 射撃</span></footer>
 <section id="touch" aria-label="タッチ操作"><div class="dpad"><button data-key="ArrowUp">▲</button><button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button></div><div class="actions"><button data-key="Space">BOOST</button><button data-key="KeyQ">MISSILE</button><button data-key="KeyE">BLADE</button><button data-key="fire">FIRE</button></div></section>
</main><script src="engine.js"></script><script src="game.js"></script></body></html>
